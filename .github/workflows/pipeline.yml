name: pipeline

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: python3 -m pip install --upgrade pytest

      - name: Run unit tests
        run: python3 -m pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenCode
        run: npm i -g opencode-ai

      - name: Compile-check the helpers
        run: python3 -m py_compile h1common.py h1scope.py h1reports.py h1report.py h1license.py mock_model_server.py

      - name: Run offline pipeline smoke test
        run: ./test-pipeline.sh
