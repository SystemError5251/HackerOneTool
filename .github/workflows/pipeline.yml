name: pipeline

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenCode
        run: npm i -g opencode-ai

      - name: Compile-check the helpers
        run: python3 -m py_compile h1scope.py h1reports.py h1report.py mock_model_server.py

      - name: Run offline pipeline smoke test
        run: ./test-pipeline.sh
